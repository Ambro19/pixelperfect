[pytest]
# The new suite lives in tests/suite. The three older files in tests/ need a
# live server, real Chromium and the public internet, so they are not part of
# the default run; run them by path if you want them.
testpaths = tests/suite
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -ra --strict-markers
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
